<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #f4f7fb; margin: 0; padding: 50px; }
  .human-bg {
    position: absolute;
    width: 600px;
    height: 400px;
    bottom: 0; right: 0;
    opacity: 0.8;
  }
  .arm {
    transform-origin: 70% 20%;
    animation: type 0.5s infinite alternate;
  }
  .arm.right {
    animation: type 0.4s infinite alternate-reverse;
  }
  @keyframes type {
    0% { transform: rotate(0deg) translateY(0); }
    100% { transform: rotate(-5deg) translateY(5px); }
  }
  .screen-glow {
    animation: glow 2s infinite alternate;
  }
  @keyframes glow {
    0% { fill: #8ab4ff; opacity: 0.6; }
    100% { fill: #1e4d8c; opacity: 0.9; }
  }
  .floating-code {
    animation: floatUp 4s infinite linear;
  }
  @keyframes floatUp {
    0% { transform: translateY(10px); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(-40px); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="human-bg">
    <svg viewBox="0 0 600 400" width="100%" height="100%">
      <!-- Desk -->
      <path d="M50 350 L550 350 L500 400 L100 400 Z" fill="#d1d9e6" />
      <rect x="80" y="360" width="440" height="10" fill="#aab8c2" />
      
      <!-- Monitor Stand -->
      <rect x="285" y="300" width="30" height="50" fill="#b0c0d0" />
      <path d="M260 350 L340 350 L350 360 L250 360 Z" fill="#90a0b0" />

      <!-- Monitor -->
      <rect x="200" y="160" width="200" height="140" rx="10" fill="#2c3e50" />
      <rect x="210" y="170" width="180" height="110" rx="5" class="screen-glow" />
      
      <!-- Code lines on monitor -->
      <rect x="220" y="180" width="60" height="6" fill="#fff" opacity="0.8" />
      <rect x="220" y="195" width="120" height="6" fill="#fff" opacity="0.6" />
      <rect x="220" y="210" width="90" height="6" fill="#fff" opacity="0.6" />
      <rect x="220" y="225" width="140" height="6" fill="#fff" opacity="0.5" />
      <rect x="220" y="240" width="50" height="6" fill="#fff" opacity="0.8" />

      <!-- Human Body -->
      <ellipse cx="430" cy="200" rx="45" ry="50" fill="#1e4d8c" />
      <rect x="385" y="230" width="90" height="150" rx="20" fill="#1e4d8c" />
      
      <!-- Head -->
      <circle cx="430" cy="120" r="35" fill="#f0c0a0" />
      
      <!-- Arms/Hands -->
      <path d="M400 240 Q350 280 340 330 Q345 340 360 330 Q370 290 410 250 Z" fill="#f0c0a0" class="arm" />
      <path d="M460 240 Q450 280 400 335 Q405 345 415 340 Q460 300 470 250 Z" fill="#e0b090" class="arm right" />

      <!-- Floating Elements -->
      <text x="150" y="150" fill="#1e4d8c" font-size="30" font-weight="bold" class="floating-code" style="animation-delay: 0s;">&lt;/&gt;</text>
      <text x="450" y="100" fill="#f59e0b" font-size="36" font-weight="bold" class="floating-code" style="animation-delay: 1.5s;">{ }</text>
      <text x="250" y="120" fill="#3b6fc4" font-size="28" font-weight="bold" class="floating-code" style="animation-delay: 3s;">CSS</text>
    </svg>
  </div>
